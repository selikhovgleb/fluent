name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: fluent-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22.19.0
          cache: npm
          package-manager-cache: true

      - name: Install dependencies
        run: npm ci

      - name: Validate configuration
        run: |
          test -n "$AWS_REGION" || { echo "Set the AWS_REGION repository variable."; exit 1; }
          test -n "$ADMIN_EMAILS" || { echo "Set the ADMIN_EMAILS repository variable."; exit 1; }
          test -n "${{ vars.AWS_DEPLOY_ROLE_ARN }}" || { echo "Set the AWS_DEPLOY_ROLE_ARN repository variable."; exit 1; }

      - name: Lint and test
        run: |
          npm run lint
          npm test

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Confirm required secrets exist
        run: |
          echo "OPENAI_SECRET_ARN=$(aws secretsmanager describe-secret --secret-id fluent-production/openai-api-key --query ARN --output text)" >> "$GITHUB_ENV"
          echo "GOOGLE_CLIENT_ID_SECRET_ARN=$(aws secretsmanager describe-secret --secret-id fluent-production/google-client-id --query ARN --output text)" >> "$GITHUB_ENV"
          echo "GOOGLE_CLIENT_SECRET_SECRET_ARN=$(aws secretsmanager describe-secret --secret-id fluent-production/google-client-secret --query ARN --output text)" >> "$GITHUB_ENV"

      - name: Synthesize infrastructure
        run: |
          CONTEXT=(--context "adminEmails=$ADMIN_EMAILS" --context "openAiSecretArn=$OPENAI_SECRET_ARN" --context "googleClientIdSecretArn=$GOOGLE_CLIENT_ID_SECRET_ARN" --context "googleClientSecretSecretArn=$GOOGLE_CLIENT_SECRET_SECRET_ARN")
          npm run aws:synth -- "${CONTEXT[@]}"

      - name: Deploy application and infrastructure
        run: |
          CONTEXT=(--context "adminEmails=$ADMIN_EMAILS" --context "openAiSecretArn=$OPENAI_SECRET_ARN" --context "googleClientIdSecretArn=$GOOGLE_CLIENT_ID_SECRET_ARN" --context "googleClientSecretSecretArn=$GOOGLE_CLIENT_SECRET_SECRET_ARN")
          npm run aws:deploy -- "${CONTEXT[@]}"

      - name: Roll out image on EC2
        run: |
          INSTANCE_ID=$(aws cloudformation describe-stacks --stack-name FluentProduction --query "Stacks[0].Outputs[?OutputKey=='ApplicationInstanceId'].OutputValue" --output text)
          IMAGE_URI=$(aws cloudformation describe-stacks --stack-name FluentProduction --query "Stacks[0].Outputs[?OutputKey=='ApplicationImageUri'].OutputValue" --output text)
          APP_URL=$(aws cloudformation describe-stacks --stack-name FluentProduction --query "Stacks[0].Outputs[?OutputKey=='ApplicationUrl'].OutputValue" --output text)
          test -n "$INSTANCE_ID"
          test -n "$IMAGE_URI"
          test -n "$APP_URL"

          DEPLOY_COMMAND="for attempt in \$(seq 1 60); do if [ -x /opt/fluent/deploy.sh ]; then sudo /opt/fluent/deploy.sh '$IMAGE_URI' '$APP_URL'; exit \$?; fi; sleep 5; done; exit 1"
          PARAMETERS=$(jq -cn --arg command "$DEPLOY_COMMAND" '{commands:[$command]}')
          COMMAND_ID=""
          for attempt in $(seq 1 30); do
            if COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --parameters "$PARAMETERS" --query Command.CommandId --output text 2>/dev/null); then
              break
            fi
            sleep 10
          done
          test -n "$COMMAND_ID"

          for attempt in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)
            case "$STATUS" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for EC2 deployment command $COMMAND_ID" >&2
          exit 1

      - name: Verify production health
        id: health
        run: |
          APP_URL=$(aws cloudformation describe-stacks --stack-name FluentProduction --query "Stacks[0].Outputs[?OutputKey=='ApplicationUrl'].OutputValue" --output text)
          test -n "$APP_URL"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$APP_URL/api/health" >/dev/null; then
              echo "url=$APP_URL" >> "$GITHUB_OUTPUT"
              echo "### Production deployed" >> "$GITHUB_STEP_SUMMARY"
              echo "[$APP_URL]($APP_URL) passed its health check." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed for $APP_URL" >&2
          exit 1
